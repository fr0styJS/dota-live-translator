sample_rate: 16000
vad:
  window_ms: 512
  min_speech_ms: 600
  silence_ms: 400
asr:
  model: large-v3-turbo
  compute_type: int8_float16
  device: cuda
  languages: [ru, en, es, uk, tl, pt, id]
mt:
  model: facebook/nllb-200-distilled-600M
  device: cuda
  target: eng_Latn
server:
  port: 5111
  host: 127.0.0.1
dota:
  process: dota2.exe
  idle_suspend_sec: 30
glossary_lock: [ss, rosh, gank, b, push, stack, pull, ward, tide, tidehunter, mid, top, bot, carry, support, rosh, smoke, dive]

ui:
  overlay_lines: 10   # subtitle lines kept on screen (high-intensity comms need more)

gsi:
  port: 5300          # must match gamestate_integration_*.cfg (tools/gsi_probe.py --write-cfg)
  dump_raw: false     # true = write the last raw payload to logs/gsi-raw.json (every 5s)
  chat:
    enabled: true     # translate typed chat, not just voice
    channels:         # Dota channel_type -> tag shown in the overlay (verified live)
      12: TEAM
      11: ALL
  events:            # objective ticker in the overlay
    enabled: true
    hero_kills: false   # hero kills / sprees too (noisy in teamfights)
